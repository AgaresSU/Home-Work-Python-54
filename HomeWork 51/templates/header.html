<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <ul>
    {% for m in menu %}
        {% if m.url == active %}
        <li><a href="{{ m.url }}" class="active">{{ m.title }}</a></li>
        {% else %}
        <li><a href="{{ m.url }}">{{ m.title }}</a></li>
        {% endif %}
    {% endfor %}
    </ul>
