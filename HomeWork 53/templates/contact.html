{% extends 'base.html' %}

{% block title %}
{{ super() }}
{% endblock %}

{% block content %}
{{ super() }}

{% for cat, msg in get_flashed_messages(True) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
{% endfor %}

<p>
    Здесь можно оставить заявку, если с плюмбусом что-то не так.
</p>

<form action="/contact" method="post" class="form-contact">
    <p>Имя: <input type="text" name="username" required></p>
    <p>Email: <input type="text" name="email" required></p>
    <p>Что случилось с плюмбусом:</p>
    <p><textarea name="message" cols="45" rows="8"></textarea></p>
    <p><input type="submit" value="Отправить заявку"></p>
</form>
{% endblock %}
